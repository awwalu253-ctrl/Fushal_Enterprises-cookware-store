{% extends "admin/base_admin.html" %}

{% block page_title %}Add Coupon{% endblock %}

{% block admin_content %}
<div class="card">
    <div class="card-header">
        <h4 class="mb-0">Add New Coupon</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Coupon Code *</label>
                    <input type="text" name="code" class="form-control" required placeholder="WELCOME10">
                    <small class="text-muted">Will be converted to uppercase</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Description</label>
                    <input type="text" name="description" class="form-control" placeholder="10% off your first order">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Discount Type *</label>
                    <select name="discount_type" class="form-select" required>
                        <option value="percentage">Percentage (%)</option>
                        <option value="fixed">Fixed Amount (₦)</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Discount Value *</label>
                    <input type="number" name="discount_value" class="form-control" step="0.01" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Minimum Order Amount</label>
                    <input type="number" name="min_order_amount" class="form-control" step="0.01" value="0">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Maximum Discount (for percentage)</label>
                    <input type="number" name="max_discount" class="form-control" step="0.01" placeholder="Optional">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Usage Limit</label>
                    <input type="number" name="usage_limit" class="form-control" placeholder="Leave empty for unlimited">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Per User Limit</label>
                    <input type="number" name="per_user_limit" class="form-control" value="1">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Valid From</label>
                    <input type="date" name="valid_from" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Valid Until</label>
                    <input type="date" name="valid_until" class="form-control">
                </div>
                <div class="col-md-12 mb-3">
                    <div class="form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" checked>
                        <label class="form-check-label">Active</label>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-terracotta">Create Coupon</button>
            <a href="{{ url_for('admin.manage_coupons') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

{% extends "admin/base_admin.html" %}
{% block title %}Live Chat{% endblock %}
{% block admin_content %}
<div class="chat-dashboard">
    <h1 class="mb-4">Live Chat Support</h1>
    
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Active Sessions</h5>
                </div>
                <div class="card-body p-0" id="sessionsList" style="height: 500px; overflow-y: auto;">
                    <div class="text-center p-4 text-muted">Loading sessions...</div>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0" id="currentSessionTitle">Select a session to start chatting</h5>
                </div>
                <div class="card-body" id="chatMessages" style="height: 400px; overflow-y: auto;">
                    <div class="text-center text-muted">No session selected</div>
                </div>
                <div class="card-footer">
                    <div class="input-group">
                        <input type="text" id="adminMessage" class="form-control" placeholder="Type your reply...">
                        <button class="btn btn-terracotta" onclick="sendAdminMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentSession = null;

function loadSessions() {
    fetch('/chat/sessions')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('sessionsList');
            if (data.sessions.length === 0) {
                container.innerHTML = '<div class="text-center p-4 text-muted">No active sessions</div>';
                return;
            }
            container.innerHTML = data.sessions.map(s => `
                <div class="session-item p-3 border-bottom" onclick="selectSession('${s.session_id}')" style="cursor: pointer;">
                    <div class="d-flex justify-content-between">
                        <strong>Session: ${s.session_id.slice(-8)}</strong>
                        ${s.unread > 0 ? `<span class="badge bg-danger">${s.unread}</span>` : ''}
                    </div>
                    <small class="text-muted">${s.last_message.substring(0, 50)}</small>
                    <div><small>${s.last_time}</small></div>
                </div>
            `).join('');
        });
}

function selectSession(sessionId) {
    currentSession = sessionId;
    document.getElementById('currentSessionTitle').innerHTML = `Chatting with ${sessionId.slice(-8)}`;
    loadMessages(sessionId);
}

function loadMessages(sessionId) {
    fetch(`/chat/messages/${sessionId}`)
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('chatMessages');
            container.innerHTML = data.messages.map(m => `
                <div class="message mb-3 ${m.sender === 'admin' ? 'text-end' : ''}">
                    <div class="message-bubble d-inline-block p-2 px-3 rounded-3 ${m.sender === 'admin' ? 'bg-terracotta text-white' : 'bg-light'}">
                        <strong>${m.sender_name || (m.sender === 'admin' ? 'Admin' : 'Customer')}:</strong><br>
                        ${m.message}
                    </div>
                    <div><small class="text-muted">${m.timestamp}</small></div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        });
}

function sendAdminMessage() {
    const message = document.getElementById('adminMessage').value;
    if (!message || !currentSession) return;
    
    fetch('/chat/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: currentSession, message: message})
    }).then(() => {
        document.getElementById('adminMessage').value = '';
        loadMessages(currentSession);
    });
}

setInterval(loadSessions, 5000);
loadSessions();
</script>

<style>
.session-item:hover { background: #f8f9fa; }
.message-bubble { max-width: 80%; word-wrap: break-word; }
</style>
{% endblock %}

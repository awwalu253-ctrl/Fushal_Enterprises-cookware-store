{% extends "admin/base_admin.html" %}
{% block title %}Edit Product{% endblock %}
{% block admin_content %}
<div class="card">
    <div class="card-header">
        <h4 class="mb-0">Edit Product: {{ product.name }}</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Product Name *</label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">SKU *</label>
                    <input type="text" name="sku" class="form-control" value="{{ product.sku }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Price *</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Compare Price</label>
                    <input type="number" step="0.01" name="compare_price" class="form-control" value="{{ product.compare_price or '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Stock Quantity *</label>
                    <input type="number" name="stock_quantity" class="form-control" value="{{ product.stock_quantity }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Low Stock Threshold</label>
                    <input type="number" name="low_stock_threshold" class="form-control" value="{{ product.low_stock_threshold }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <select name="category_id" class="form-select">
                        <option value="">Select Category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Brand</label>
                    <input type="text" name="brand" class="form-control" value="{{ product.brand or '' }}">
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Image URL</label>
                    <input type="url" name="image_url" class="form-control" value="{{ product.image_url or '' }}">
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Short Description</label>
                    <input type="text" name="short_description" class="form-control" value="{{ product.short_description or '' }}">
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Full Description</label>
                    <textarea name="description" class="form-control" rows="5" required>{{ product.description }}</textarea>
                </div>
                <div class="col-md-12 mb-3">
                    <div class="form-check">
                        <input type="checkbox" name="is_featured" class="form-check-input" {% if product.is_featured %}checked{% endif %}>
                        <label class="form-check-label">Featured Product</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" name="is_bestseller" class="form-check-input" {% if product.is_bestseller %}checked{% endif %}>
                        <label class="form-check-label">Best Seller</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" name="is_new" class="form-check-input" {% if product.is_new %}checked{% endif %}>
                        <label class="form-check-label">New Arrival</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" {% if product.is_active %}checked{% endif %}>
                        <label class="form-check-label">Active</label>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-terracotta">Update Product</button>
            <a href="{{ url_for('admin.manage_products') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

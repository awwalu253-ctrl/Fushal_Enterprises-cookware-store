{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="error-page py-5">
    <div class="container text-center">
        <i class="fas fa-search fa-5x text-terracotta mb-4"></i>
        <h1 class="display-1 fw-bold">404</h1>
        <h2 class="mb-3">Page Not Found</h2>
        <p class="text-muted mb-4">The page you are looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-terracotta">
            <i class="fas fa-home me-2"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}

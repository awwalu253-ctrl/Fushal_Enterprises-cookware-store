{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="error-page py-5">
    <div class="container text-center">
        <i class="fas fa-exclamation-triangle fa-5x text-terracotta mb-4"></i>
        <h1 class="display-1 fw-bold">500</h1>
        <h2 class="mb-3">Server Error</h2>
        <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-terracotta">
            <i class="fas fa-home me-2"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}
